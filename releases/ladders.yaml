# Frontier release decisions (spec 0001, section 1.1). One entry per Epoch candidate.
# r: reason code (releases/rule.py vocabulary)  v: version  t: tier  ref: model it is relative to  n: note
# Tiers are listed low to high; rank only matters within one version. `small` tiers are never frontier.
# Tier order evidence for 2026 lines is Epoch's abstract text for each model (see docs/JOURNAL.md).

